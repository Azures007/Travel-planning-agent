services:
  db:
    image: postgres:16
    container_name: travel-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_agent
    ports:
      - "5433:5432"
    volumes:
      - travel_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_agent_pgdata:
